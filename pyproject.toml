[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bergomi-guyon"
version = "0.1.0"
authors = [{ name = "Florian Bourgey", email = "fb2615@nyu.edu" }]
description = "Exact forest-expansion coefficients for the Bergomi–Guyon smile expansion"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.16.7",
    "sympy>=1.14.0",
]

[project.scripts]
generate-bg-coefficients = "bergomi_guyon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bergomi_guyon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
